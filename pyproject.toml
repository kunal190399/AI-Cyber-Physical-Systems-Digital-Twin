[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-cyber-physical-digital-twin"
version = "0.1.0"
description = "A simulated AI-enabled cyber-physical inspection robot and digital twin"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "scikit-learn>=1.3"]

[project.optional-dependencies]
dashboard = ["streamlit>=1.32", "pandas>=2.0", "plotly>=5.18"]
mqtt = ["paho-mqtt>=2.0"]
dev = ["pytest>=8.0", "ruff>=0.4", "streamlit>=1.32", "pandas>=2.0", "plotly>=5.18", "paho-mqtt>=2.0"]

[project.scripts]
cps-twin = "cps_twin.cli:main"

[tool.setuptools.packages.find]
include = ["cps_twin*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
